# Relevance of changes between builds.
#
# Read by backend/app/core/change_rules.py, whose docstring states how the
# relevance of a change follows from this file. The importer classifies the
# change log with it (item_change.relevance) and reclassifies the whole log
# when the file changes: edit, then run `python import_cli.py import-cas`.
#
# Every stat and effect type (spell_id) is listed as `id = "name"` under the
# class it belongs to. The name is for the reader only.
#
#   gameplay   what an item does and who can use it
#   economy    what it is worth
#   cosmetic   how it looks and sounds, and client housekeeping
#
# An id under `unclassified` is known to occur in changes and has not been
# judged yet; it takes `default`, as does an id that is not listed at all.
# `python -m pytest app/tests/test_change_rules_store.py` fails when a stat or
# effect type occurs in the store's changes and is not in this file.

default = "gameplay"

# Changes classified as a whole.
[changes]
added = "gameplay"            # an item that appears in a build
removed = "gameplay"          # an item that disappears
actions = "gameplay"          # any action or requirement
attack_defense = "gameplay"   # attack and defense skills
event = "cosmetic"            # effects moved to another event number, nothing else
static_instance = "cosmetic"  # stat 23, the client's row id
animation_mesh = "cosmetic"
shop = "economy"              # shop inventory data

