name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend type-check, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Match the build stage of frontend/Dockerfile.
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
      # The tests that need a running backend skip themselves without one.
      - run: npm test

  backend:
    name: Backend formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Match backend/Dockerfile.
          python-version: "3.12"

      # The backend tests are not run here. Importing the application needs
      # DATABASE_URL, and most tests read the loaded store of the development
      # database (147 builds), which CI does not have; the suite has no
      # marker or directory that selects the rest. Run them where the store
      # is: `python -m pytest app/tests -q` in backend/.
      - run: pip install "$(grep '^black==' backend/requirements.txt)"
      - run: black --check backend/app backend/tools backend/import_cli.py backend/extract_builds.py

  docker:
    name: Build ${{ matrix.service }} image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - service: api
            dockerfile: backend/Dockerfile
          - service: web
            dockerfile: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Build only: the deploy platform builds and runs its own images from
      # docker-compose.yml. This catches a broken Dockerfile before it
      # reaches the server.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
